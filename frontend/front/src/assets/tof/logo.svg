<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F5E6C8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0784A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1410;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="url(#bgGrad)" rx="4"/>

  <!-- Decorative corner ornaments -->
  <!-- Top-left -->
  <g stroke="url(#goldGrad)" stroke-width="0.8" fill="none" opacity="0.6">
    <line x1="20" y1="20" x2="50" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="50"/>
    <circle cx="20" cy="20" r="2" fill="url(#goldGrad)" stroke="none"/>
  </g>
  <!-- Top-right -->
  <g stroke="url(#goldGrad)" stroke-width="0.8" fill="none" opacity="0.6">
    <line x1="580" y1="20" x2="550" y2="20"/>
    <line x1="580" y1="20" x2="580" y2="50"/>
    <circle cx="580" cy="20" r="2" fill="url(#goldGrad)" stroke="none"/>
  </g>
  <!-- Bottom-left -->
  <g stroke="url(#goldGrad)" stroke-width="0.8" fill="none" opacity="0.6">
    <line x1="20" y1="280" x2="50" y2="280"/>
    <line x1="20" y1="280" x2="20" y2="250"/>
    <circle cx="20" cy="280" r="2" fill="url(#goldGrad)" stroke="none"/>
  </g>
  <!-- Bottom-right -->
  <g stroke="url(#goldGrad)" stroke-width="0.8" fill="none" opacity="0.6">
    <line x1="580" y1="280" x2="550" y2="280"/>
    <line x1="580" y1="280" x2="580" y2="250"/>
    <circle cx="580" cy="280" r="2" fill="url(#goldGrad)" stroke="none"/>
  </g>

  <!-- Central decorative diamond / gem motif -->
  <g transform="translate(300, 72)" filter="url(#glow)">
    <!-- Outer diamond -->
    <polygon points="0,-22 13,-8 0,6 -13,-8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.9"/>
    <!-- Inner diamond -->
    <polygon points="0,-14 8,-5 0,3 -8,-5" fill="url(#goldGrad)" opacity="0.3"/>
    <!-- Center dot -->
    <circle cx="0" cy="-5" r="2.5" fill="url(#goldGrad)"/>
    <!-- Radiating lines -->
    <line x1="0" y1="-26" x2="0" y2="-30" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <line x1="17" y1="-8" x2="21" y2="-8" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <line x1="-17" y1="-8" x2="-21" y2="-8" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <line x1="0" y1="10" x2="0" y2="14" stroke="url(#goldGrad)" stroke-width="0.8"/>
  </g>

  <!-- Top decorative line -->
  <line x1="80" y1="100" x2="520" y2="100" stroke="url(#lineGrad)" stroke-width="0.6"/>

  <!-- MURIEL - Main brand name -->
  <text
    x="300"
    y="148"
    text-anchor="middle"
    font-family="'Didact Gothic', 'Cormorant Garamond', 'Garamond', 'Big Caslon', Georgia, serif"
    font-size="52"
    font-weight="300"
    letter-spacing="18"
    fill="url(#goldGrad)"
    filter="url(#glow)"
  >MURIEL</text>

  <!-- Thin separator line with diamonds -->
  <line x1="120" y1="165" x2="265" y2="165" stroke="url(#lineGrad)" stroke-width="0.5"/>
  <polygon points="300,159 306,165 300,171 294,165" fill="url(#goldGrad)" opacity="0.8"/>
  <line x1="335" y1="165" x2="480" y2="165" stroke="url(#lineGrad)" stroke-width="0.5"/>

  <!-- LUXURY -->
  <text
    x="300"
    y="192"
    text-anchor="middle"
    font-family="'Didact Gothic', 'Cormorant Garamond', 'Garamond', Georgia, serif"
    font-size="13"
    font-weight="400"
    letter-spacing="12"
    fill="url(#goldGrad)"
    opacity="0.85"
  >LUXURY</text>

  <!-- Small dots decorating LUXURY -->
  <circle cx="176" cy="187" r="1.2" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="424" cy="187" r="1.2" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- BEAUTY -->
  <text
    x="300"
    y="218"
    text-anchor="middle"
    font-family="'Didact Gothic', 'Cormorant Garamond', 'Garamond', Georgia, serif"
    font-size="13"
    font-weight="400"
    letter-spacing="12"
    fill="url(#goldGrad)"
    opacity="0.85"
  >BEAUTY</text>

  <!-- Bottom decorative line -->
  <line x1="80" y1="232" x2="520" y2="232" stroke="url(#lineGrad)" stroke-width="0.6"/>

  <!-- Subtle bottom tagline -->
  <text
    x="300"
    y="258"
    text-anchor="middle"
    font-family="'Garamond', Georgia, serif"
    font-size="8.5"
    font-weight="300"
    letter-spacing="4"
    fill="#C9A96E"
    opacity="0.5"
  >ÉLÉGANCE · RAFFINEMENT · PRESTIGE</text>
</svg>
